name: Dependency audit

# Runs this repository's own action on its pull requests: it audits dependency
# bumps, and doubles as a smoke test whenever the action itself changes
on:
  pull_request:
    paths:
      - go.mod
      - action.yml
      - action/**

permissions:
  contents: read
  pull-requests: write

jobs:
  go-semver-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: ./
